# GITHUB_TOKEN is read from the environment, which avoids github.com rate limits.
max_concurrency = 8
max_retries = 3
retry_wait_time = 5
timeout = 30
cache = true
max_cache_age = "1d"
accept = ["200..=204", "429"]
exclude_path = ["LICENSE", "node_modules"]
# Links to this repository itself 404 until the commit is pushed.
# npmjs.com answers CI with 403 (bot protection); those links work in a browser.
exclude = ["^https://github.com/mokevnin/dev-quality-gates/", "^https://www.npmjs.com/"]
